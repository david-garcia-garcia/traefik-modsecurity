# Loopback origin after CRS request phases on owasp/modsecurity-crs:4.3.0-nginx.
# Mount next to zz-realip.conf. Point BACKEND at http://127.0.0.1:18081.
# return 200 here runs after ModSecurity on the public server.
# Do not put return on location / of :8080 (that skips CRS phases).
# max_ranges 0 so a tiny 200 is not 416.
# If-None-Match is omitted on proxy_pass (proxy_backend.drain.conf.template)
# so this return 200 is not rewritten to 304.

server {
    listen 127.0.0.1:18081;
    server_name _;
    max_ranges 0;
    location / {
        default_type text/plain;
        return 200 "OK";
    }
}
