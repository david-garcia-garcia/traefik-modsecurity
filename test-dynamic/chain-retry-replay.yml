# File-provider router that forces Traefik retry: first LB server is unreachable,
# second is whoami-chain-retry. Distinct path so PathPrefix(`/chain-retry`) cannot shadow it.
http:
  routers:
    retry-force:
      rule: "PathPrefix(`/retry-force`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - waf-chain-retry@docker
        - retry-chain@docker
      service: retry-force
  services:
    retry-force:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1"
          - url: "http://whoami-chain-retry:80"
